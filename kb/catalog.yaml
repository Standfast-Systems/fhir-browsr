# FHIR Initializr - IG classification, draft v0.1 (2026-10-20)
# Source: FHIR/ig-registry fhir-ig-list.json, US + universal realm (277 guides).
# Other countries: auto-add the national base for the chosen country; not classified yet.

groups:
  foundation: {layer: auto, label: "Foundation (base data model + API)"}
  library: {layer: auto, label: "Shared libraries (pulled in as dependencies)"}
  wf-patient-access: {layer: workflow, label: "Patient & consumer access"}
  wf-prior-auth: {layer: workflow, label: "Coverage & prior authorization"}
  wf-payer-exchange: {layer: workflow, label: "Payer clinical data exchange"}
  wf-payments-value: {layer: workflow, label: "Payments, cost & value-based care"}
  wf-care-coord: {layer: workflow, label: "Care coordination & transitions"}
  wf-orders: {layer: workflow, label: "Orders & referrals"}
  wf-public-health: {layer: workflow, label: "Public health reporting"}
  wf-vital-records: {layer: workflow, label: "Vital records"}
  wf-quality: {layer: workflow, label: "Quality measurement"}
  wf-cds: {layer: workflow, label: "Clinical decision support"}
  wf-research: {layer: workflow, label: "Research & registries"}
  wf-directories: {layer: workflow, label: "Directories & scheduling"}
  wf-regulatory: {layer: workflow, label: "FDA / regulatory submissions"}
  wf-doc-sharing: {layer: workflow, label: "Document sharing (IHE mobile)"}
  wf-who-smart: {layer: workflow, label: "WHO SMART Guidelines"}
  wf-portable: {layer: workflow, label: "Patient-held & cross-border records"}
  cap-app: {layer: capability, label: "App integration & launch"}
  cap-security: {layer: capability, label: "Authorization & trust"}
  cap-identity: {layer: capability, label: "Identity & patient matching"}
  cap-privacy: {layer: capability, label: "Consent, privacy & de-identification"}
  cap-audit: {layer: capability, label: "Audit & provenance (incl. AI transparency)"}
  cap-notify: {layer: capability, label: "Notifications & subscriptions"}
  cap-bulk: {layer: capability, label: "Bulk export & analytics"}
  cap-forms: {layer: capability, label: "Forms & data capture"}
  cap-terminology: {layer: capability, label: "Terminology services"}
  cap-bridge: {layer: capability, label: "Bridging legacy formats (v2, CDA, DICOM, OMOP, CDISC)"}
  ct-oncology: {layer: content, label: "Oncology"}
  ct-cardiology: {layer: content, label: "Cardiology"}
  ct-behavioral: {layer: content, label: "Behavioral health"}
  ct-post-acute: {layer: content, label: "Post-acute & functional status"}
  ct-maternal: {layer: content, label: "Maternal & child"}
  ct-lab-genomics: {layer: content, label: "Lab & genomics"}
  ct-imaging: {layer: content, label: "Imaging & eye care"}
  ct-meds: {layer: content, label: "Medications & pharmacy"}
  ct-devices: {layer: content, label: "Devices & remote monitoring"}
  ct-history: {layer: content, label: "Occupational & military service history"}
  ct-observations: {layer: content, label: "Vitals, symptoms, activity & patient-reported data"}
  x-legacy: {layer: hidden, label: "Legacy (pre-R4 only)"}
  x-not-fhir: {layer: hidden, label: "Not FHIR (CDA, EHR-S functional models)"}
  x-tooling: {layer: hidden, label: "Authoring/tooling, not for implementers"}
  x-unofficial: {layer: hidden, label: "Vendor or unsupported proposals"}

