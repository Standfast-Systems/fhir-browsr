      - {ig: hl7.fhir.uv.bulkdata, versions: ["2.0.0"], actors: [client]}
    suites:
      - {id: bulk_data_v101, title: "Bulk Data v1.0.1", actor: server, igVersion: "1.0.1"}
      - {id: bulk_data_v200, title: "Bulk Data v2.0.0", actor: server, igVersion: "2.0.0"}
      - {id: bulk_data_v200_client, title: "Bulk Data v2.0.0 Client", actor: client, igVersion: "2.0.0"}

