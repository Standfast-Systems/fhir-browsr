# ONC Health IT Certification: 45 CFR 170.315(g)(31)–(g)(33) electronic prior authorization (HTI-4).
#
# Provider-side clients for the payer Prior Authorization API. Added by HTI-4 (in the FY2026 IPPS
# final rule, effective 2025-10-01). The FY2027 IPPS final rule (effective 2026-10-01) replaced the
# 2.0.1 IG versions in 170.215(j) with CRD 2.2.1, DTR 2.2.0 and PAS 2.2.1, with no transition period.
# Curated 2026-10-20.

id: onc-epa
name: "ONC certification — §170.315(g)(31)–(33) electronic prior authorization"
short: "ONC (g)(31)–(33)"
kind: regulation
authority: "ONC (HHS)"
summary: >-
  Certification criteria for the EHR side of electronic prior authorization: discover coverage
  requirements (CRD client), complete documentation (DTR "full EHR"), and submit and track the
  request (PAS client). There is no deadline to certify; demand comes from CMS's Promoting
  Interoperability "Electronic Prior Authorization" measure.
roles: [ehr-developer, provider-org]
realms: [us]
fhir: ["4.0.1"]
cite:
  source: ecfr-170-315
  pin: "(g)(31)–(g)(33)"
  url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-D/part-170/subpart-C/section-170.315#p-170.315(g)(31)

components:
  - id: g31-crd
    name: "(g)(31) Coverage requirements discovery"
    summary: CRD client, including the CDS Hooks order-sign hook via (j)(20).
    in_force: {from: "2025-10-01"}
    default: true
    cite:
      source: ecfr-170-315
      pin: "(g)(31)"
      url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-D/part-170/subpart-C/section-170.315#p-170.315(g)(31)
  - id: g32-dtr
    name: "(g)(32) Prior authorization documentation"
    summary: DTR full-EHR client, with SMART Backend Services authorization.
    in_force: {from: "2025-10-01"}
    default: true
    cite:
      source: ecfr-170-315
      pin: "(g)(32)"
      url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-D/part-170/subpart-C/section-170.315#p-170.315(g)(32)
  - id: g33-pas
    name: "(g)(33) Prior authorization submission"
    summary: PAS client, receiving pended responses through subscriptions via (j)(21).
    in_force: {from: "2025-10-01"}
    default: true
    cite:
      source: ecfr-170-315
      pin: "(g)(33)"
      url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-D/part-170/subpart-C/section-170.315#p-170.315(g)(33)

rules:
