notes:
  - >-
    No date by which these criteria must be certified: "We are, therefore, not defining a specific date
    by which these criteria must be certified" (90 FR 37168). The pressure comes from CMS's Promoting
    Interoperability Electronic Prior Authorization measure: optional with bonus points for CY 2027,
    required (attest or exclusion) for hospitals and CAHs from the CY 2028 EHR reporting period; the
    same change for MIPS clinicians is proposed in the CY 2027 PFS rule, not final as of this KB.
  - >-
    Payers' Prior Authorization APIs under CMS-0057-F are only recommended to use CRD/DTR/PAS, and CMS's
    page still lists 2.0.1 and 2.1.0. Expect to meet payers on older versions until CMS finalizes
    CMS-0062-P (proposed: payers on the 170.215 versions by October 1, 2027).
