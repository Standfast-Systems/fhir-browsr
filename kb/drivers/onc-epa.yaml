      - http://hl7.org/fhir/us/davinci-crd/CapabilityStatement/crd-client
    components: [g31-crd]
    cite:
      source: ecfr-170-315
      pin: "(g)(31)"
      url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-D/part-170/subpart-C/section-170.315#p-170.315(g)(31)
    versions:
      - version: "2.0.1"
        basis: adopted
        from: "2025-10-01"
        expires: "2026-10-01"
        cite:
          source: fr-hti-4
          pin: "45 CFR 170.215(j)(1)(i) as of 2025-10-01 (90 FR 37208)"
          url: https://www.ecfr.gov/on/2025-10-01/title-45/subtitle-A/subchapter-D/part-170/subpart-B/section-170.215
      - version: "2.2.1"
