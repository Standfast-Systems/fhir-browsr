        cite: {source: cms-recommended-igs, pin: "Payer-to-Payer"}
      - version: "2.1.0"
        basis: recommended
        from: "2026-04-14"
        cite: {source: cms-recommended-igs, pin: "Payer-to-Payer"}

  # ------------------------------------------------------------------------------------------
  # Counterparties. CMS-0057-F binds payers; these roles connect to payers' APIs as clients.

  - id: cms-app-carin-client
    ig: hl7.fhir.us.carin-bb
    actor: client
    strength: optional
    roles: [app-developer]
    components: [patient-access]
    note: Payers' Patient Access APIs are recommended to follow CARIN Blue Button; your app reads them as a client.
    cite: {source: cms-recommended-igs, pin: "Patient Access"}
    versions:
      - version: "2.0.0"
        basis: recommended
        from: "2024-02-08"
        cite: {source: cms-recommended-igs, pin: "Patient Access"}
      - version: "2.1.0"
        basis: recommended
        from: "2026-04-14"
        cite: {source: cms-recommended-igs, pin: "Patient Access"}

  - id: cms-app-smart-client
    ig: hl7.fhir.uv.smart-app-launch
    actor: client
    strength: optional
    capstmts: []  # SMART's only CapabilityStatement (App State) is an optional capability
    roles: [app-developer]
    components: [patient-access]
    note: Patient Access APIs authorize apps with SMART App Launch and OpenID Connect.
    cite: {source: ecfr-42-422-119, pin: "(c)(1)"}
    versions:
      - version: "2.0.0"
        basis: permitted-update
        from: "2024-02-08"
        cite: {source: cms-faq-standards}
      - version: "2.2.0"
        basis: permitted-update
        from: "2024-08-19"
        cite: {source: ecfr-42-422-119, pin: "(c)(4)"}

  - id: cms-provider-bulk-client
    ig: hl7.fhir.uv.bulkdata
    actor: client
    strength: optional
    roles: [provider-org, ehr-developer]
    components: [provider-access]
    note: Providers pull attributed members' data from payers' Provider Access APIs, often in bulk.
    cite: {source: ecfr-42-422-121, pin: "(a)"}
    versions:
      - version: "1.0.1"
        basis: adopted
        cite: {source: ecfr-42-422-121, pin: "(a)"}
      - version: "2.0.0"
        basis: permitted-update
        from: "2022-08-29"
        cite: {source: ecfr-42-422-119, pin: "(c)(4)"}

  - id: cms-provider-pdex-client
    ig: hl7.fhir.us.davinci-pdex
    actor: client
    strength: optional
    roles: [provider-org, ehr-developer]
    components: [provider-access]
    cite: {source: cms-recommended-igs, pin: "Provider Access"}
    versions:
      - version: "2.0.0"
        basis: recommended
        from: "2024-02-08"
        cite: {source: cms-recommended-igs, pin: "Provider Access"}
      - version: "2.1.0"
        basis: recommended
        from: "2026-04-14"
        cite: {source: cms-recommended-igs, pin: "Provider Access"}

notes:
  - >-
    Compliance dates differ by payer type: Medicare Advantage and Medicaid/CHIP fee-for-service by
    January 1, 2027; Medicaid and CHIP managed care by the rating period beginning on or after
    January 1, 2027; QHP issuers on the FFEs for plan years beginning on or after January 1, 2027.
    Parallel sections: Medicaid 42 CFR 431.60/.61/.70/.80, CHIP 457.730/.731/.732/.760, managed care
    438.242 and 457.1233(d), QHP 45 CFR 156.221/.222/.223 (QHPs have no Provider Directory API duty).
  - >-
    The CFR still cites 45 CFR 170.215(b)(1)(i) (US Core 3.1.1) and (c)(1) (SMART 1.0.0), which expired
    in ONC's program on January 1, 2026. Newer versions are allowed under 42 CFR 422.119(c)(4) when the
    National Coordinator has approved them. CMS-0062-P (proposed April 14, 2026; not final as of this KB)
    would switch the cross-references to "unexpired" versions and require the Da Vinci and CARIN IGs at
    their 170.215 versions from October 1, 2027.
  - >-
    CMS's recommended IGs are not required: "the recommended IGs listed in table H3 are not required to
    be used at this time" (CMS FAQ). Its page still lists CRD/DTR/PAS 2.0.1 and 2.1.0, while provider
    EHRs certify (g)(31)–(33) to CRD 2.2.1, DTR 2.2.0 and PAS 2.2.1 since October 1, 2026.
  - >-
    Not FHIR packages but still required: OpenID Connect Core 1.0 for Patient Access, USCDI content
    (45 CFR 170.213), the HIPAA X12 278 transaction for prior authorization (CMS's National Standards
    Group will not enforce it against FHIR-based prior authorization, per its February 28, 2024 letter),
    specific denial reasons from January 1, 2026, and annual metrics reporting from 2026.
