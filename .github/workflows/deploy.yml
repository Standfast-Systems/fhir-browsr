name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Browsr: joins data/ + snapshot/ into public/data/guides.json, failing on unknown ids.
      # Initializr: validates the KB against the snapshot and writes the rest of public/data.
      - run: npm run data
      - run: npm run typecheck
      - run: npm run test:core
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Each section gets a real page with its own link-preview tags; anything else gets 404.html.
      - run: node scripts/pages.ts dist/fhir-matchbook/browser
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/fhir-matchbook/browser

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
