name: Refresh registry snapshot

# Weekly: re-read packages.fhir.org, the IG registry and each IG's package-list.json, re-check links,
# and open a PR listing new versions. The KB itself only changes through curator review.

# The weekly schedule is off until Browsr and Initializr share one snapshot; until then this
# refreshes only Initializr's snapshot/registry.json. Restore it with:
#   schedule:
#     - cron: '17 6 * * 1'
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/tgz
          key: fhir-packages-${{ github.run_id }}
          restore-keys: fhir-packages-
      - run: cp snapshot/registry.json "$RUNNER_TEMP/registry.before.json"
      - run: node scripts/snapshot-initializr.ts --fresh
      - run: npm run links
      - run: node scripts/registry-diff.ts "$RUNNER_TEMP/registry.before.json" snapshot/registry.json "$RUNNER_TEMP/body.md"
      # Fails the job (and so the PR checks) if a KB-cited version disappeared from the registry.
      - run: npm run data
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: registry-refresh
          commit-message: 'Refresh registry snapshot'
          title: 'Registry snapshot refresh'
          body-path: ${{ runner.temp }}/body.md
          add-paths: snapshot/
