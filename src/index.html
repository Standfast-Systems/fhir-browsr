<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FHIR Initializr — the FHIR IGs your project needs, pinned and cited</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Free tool for FHIR implementers: pick your role, regulations (ONC (g)(10), CMS-0057-F, HTI-4 prior auth) and target date; get the implementation guides and versions you need, with citations, warnings, Inferno test plan, package.json and HAPI config."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <meta property="og:title" content="FHIR Initializr" />
    <meta
      property="og:description"
      content="Start a FHIR project with the implementation guides it needs — pinned, cited, ready to load."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Icons are self-hosted (scripts/icons.ts): locked-down networks block Google Fonts, and a
         missing icon font shows every icon as its name. Text fonts fall back cleanly, so they stay. -->
    <style>
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('fonts/material-symbols-outlined.woff2') format('woff2');
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'liga';
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <noscript
      >FHIR Initializr runs in your browser and needs JavaScript. The data behind it is plain JSON
      at data/index.json.</noscript
    >
  </body>
</html>
