# FHIR Mappr pattern. Format: src/core/mappr/types.ts (Pattern). Checked claims: see the PR.
id: questionnaire
type: workflow
rank: 8
kind: established
title: Send a questionnaire and store the answers as data
short: Questionnaire
ask: I want to send a questionnaire and keep the answers as data
summary: >-
  A form (Questionnaire) is filled in, the completed form (QuestionnaireResponse) is saved, and
  the answers that matter, such as a score, become Observations you can search and trend.
stack:
  moves:
    - guide: hl7.fhir.uv.sdc
      note: how forms are defined, filled in and turned into data
  carries:
    - guide: hl7.fhir.us.core
      note: the completed form, and screening and assessment results
    - guide: fhir.astp.bhp
      note: behavioral health data
resources: [Questionnaire, QuestionnaireResponse, Observation, Task]
why: >-
  Free, open-source form renderers exist, such as NLM's LHC-Forms and CSIRO's Smart Forms, and US
  Core profiles both the completed form and the screening results.
drawing:
  kind: walkthrough
  scenario: A patient fills in a PHQ-9 depression screener before a visit.
  lanes:
    - { id: patient, label: Patient, kind: person }
    - { id: system, label: "EHR or app", kind: system }
    - { id: clinician, label: Clinician, kind: staff }
  steps:
    - lane: clinician
      title: Assigns a PHQ-9
      text: before the visit
    - lane: patient
      title: Fills it in
      text: in a portal or app that shows the form
      via: Questionnaire
    - lane: system
      title: Saves the answers
      text: the completed form, as asked and answered
      via: QuestionnaireResponse
    - lane: system
      title: Pulls out the score
      text: key answers become Observations
      via: SDC extraction
    - lane: clinician
      title: Sees the score and trend
      text: alongside earlier results
  takeaway: >-
    The QuestionnaireResponse is the record of what was asked and answered; Observations are what
    you search and trend.
readFirst:
  - title: "FHIR R4: Questionnaire"
    url: https://hl7.org/fhir/R4/questionnaire.html
  - title: Structured Data Capture (SDC)
    url: https://hl7.org/fhir/uv/sdc/
  - title: "US Core: Screening and Assessments"
    url: https://hl7.org/fhir/us/core/screening-and-assessments.html
