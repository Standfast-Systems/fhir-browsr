# Clinical domains: the clinical area a guide's content is about (who builds to it stays the
# party tags). Transcribed from matchbook-domain-tags.md (2026-10-21), the product decision; change
# tags there and here together. A guide carries every domain it genuinely covers; most have none.
# Never tag by keyword. Members are npm ids; the build fails on an id it doesn't know.

- id: oncology
  label: "Oncology"
  members:
    - hl7.fhir.us.breast-radiology # Breast Radiology Report
    - hl7.fhir.uv.ihe-sdc-ecc # Cancer Checklists on FHIR (SDC/eCC)
