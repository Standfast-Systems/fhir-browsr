- id: ihe
  label: IHE
  blurb: "International building blocks for document sharing, patient identity, audit and devices, used by national and regional networks."
  prefixes: [ihe.]

- id: who
  label: WHO SMART Guidelines
  blurb: "WHO's computable guidelines for national health programs: immunization, HIV, antenatal care and more."
  prefixes: [smart.who.int., who.]
